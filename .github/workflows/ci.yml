name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - '22.23.3'
          - '24.19.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin the package manager
        run: npm install --global npm@11.9.0

      - name: Show development environment
        run: npm run doctor

      - name: Install dependencies
        run: npm ci

      - name: Check (lint, tests, build)
        run: npm run check

      - name: Ensure dependency inputs stayed unchanged
        run: git diff --exit-code -- package.json package-lock.json
